name: CI - Iris FastAPI App

on:
  push:
    branches: [ main, gke-deploy-week6 ]
  pull_request:
    branches: [ main, gke-deploy-week6 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint and Basic Test
        run: |
          python -m py_compile iris_fastapi.py
          echo "✅ Lint and syntax check passed"
